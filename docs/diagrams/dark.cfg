' Prepended by render.sh when producing the *-dark.svg variants.
'
' C4_superhero is the vendored dark C4 theme. It carries the base dark
' skinparams (including for the plain sequence diagrams) but paints C4
' elements orange, which fights with the teal accent used across the site.
' Its color variables are all declared with ?=, so setting them here — before
' the theme is pulled in — wins, and the dark diagrams keep the blue family of
' the light ones. Same diagram, two skins.
!$PERSON_BG_COLOR = "#1a5490"
!$PERSON_BORDER_COLOR = "#0d3c6b"
!$PERSON_FONT_COLOR = "#ffffff"
!$SYSTEM_BG_COLOR = "#0d4a80"
!$SYSTEM_BORDER_COLOR = "#08376b"
!$SYSTEM_FONT_COLOR = "#ffffff"
!$CONTAINER_BG_COLOR = "#11629f"
!$CONTAINER_BORDER_COLOR = "#0b4884"
!$CONTAINER_FONT_COLOR = "#ffffff"
!$COMPONENT_BG_COLOR = "#2f7bbd"
!$COMPONENT_BORDER_COLOR = "#1c5c94"
!$COMPONENT_FONT_COLOR = "#ffffff"
' External systems stay desaturated so they read as "not ours" the same way
' the gray boxes do in light mode.
!$EXTERNAL_SYSTEM_BG_COLOR = "#4a545e"
!$EXTERNAL_SYSTEM_BORDER_COLOR = "#39424a"
!$EXTERNAL_SYSTEM_FONT_COLOR = "#e8eaed"
!$EXTERNAL_CONTAINER_BG_COLOR = "#4a545e"
!$EXTERNAL_CONTAINER_BORDER_COLOR = "#39424a"
!$EXTERNAL_CONTAINER_FONT_COLOR = "#e8eaed"
!$EXTERNAL_COMPONENT_BG_COLOR = "#4a545e"
!$EXTERNAL_COMPONENT_BORDER_COLOR = "#39424a"
!$EXTERNAL_COMPONENT_FONT_COLOR = "#e8eaed"
!$EXTERNAL_PERSON_BG_COLOR = "#4a545e"
!$EXTERNAL_PERSON_BORDER_COLOR = "#39424a"
!$EXTERNAL_PERSON_FONT_COLOR = "#e8eaed"
!$ARROW_COLOR = "#9fb3c8"
!$ARROW_FONT_COLOR = "#b9c8d6"
' Boundary labels default to the element border colors, which are dark enough
' here to disappear against a dark page. Light them up.
!$BOUNDARY_COLOR = "#9fb3c8"
!$ENTERPRISE_BOUNDARY_COLOR = "#9fb3c8"
!$SYSTEM_BOUNDARY_COLOR = "#9fb3c8"
!$CONTAINER_BOUNDARY_COLOR = "#9fb3c8"
!theme C4_superhero from ../vendor/C4-PlantUML/themes
' A transparent background lets the diagram sit on whatever surface color the
' docs theme is using instead of punching a black rectangle into the page.
skinparam backgroundColor transparent
' superhero renders titles in its orange; the rest of the palette above is
' blue, so bring the title back to plain light text.
skinparam titleFontColor #e8eaed
skinparam defaultFontColor #e8eaed

' The C4 variables above only reach C4 elements. The seq-*.puml diagrams are
' plain sequence diagrams, so they need the same palette spelled out or they
' come back in superhero orange.
skinparam sequence {
    ParticipantBackgroundColor #11629f
    ParticipantBorderColor #0b4884
    ParticipantFontColor #ffffff
    ActorBackgroundColor #1a5490
    ActorBorderColor #0d3c6b
    ActorFontColor #ffffff
    LifeLineBorderColor #9fb3c8
    ArrowColor #9fb3c8
    ArrowFontColor #b9c8d6
    DividerBackgroundColor #2f3b47
    DividerBorderColor #9fb3c8
    DividerFontColor #e8eaed
    GroupBackgroundColor #2f3b47
    GroupBorderColor #9fb3c8
    GroupFontColor #e8eaed
    BoxBorderColor #9fb3c8
}
skinparam databaseBackgroundColor #4a545e
skinparam databaseBorderColor #39424a
skinparam databaseFontColor #e8eaed
skinparam noteBackgroundColor #2f3b47
skinparam noteBorderColor #9fb3c8
skinparam noteFontColor #e8eaed
